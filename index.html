<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Werkstatt Digital · CRM</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f; --surface:#0e1320; --surface2:#161d2e; --line:#1e2740;
  --text:#eef1f8; --muted:#8b94ab; --dim:#5c6579;
  --green:#22c55e; --green-d:#15803d; --blue:#3b82f6; --purple:#a78bfa;
  --amber:#fbbf24; --orange:#fb923c; --red:#f87171;
  --r:16px; --dur:180ms;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 70% -10%,rgba(59,130,246,.10),transparent 60%),radial-gradient(700px 400px at 10% 110%,rgba(34,197,94,.07),transparent 60%);pointer-events:none}
h1,h2,h3,.brand{font-family:Sora,Inter,sans-serif}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--blue)}
svg{flex:none}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50;background:var(--bg)}
#login .box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2rem;display:flex;flex-direction:column;gap:.9rem}
#login h1{font-size:1.4rem}
#login p{color:var(--muted);font-size:.85rem}
#loginErr{color:var(--red);font-size:.85rem;min-height:1.2em}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:10;background:rgba(7,9,15,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{max-width:1100px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;gap:.8rem}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand em{color:var(--green);font-style:normal}
.tabs{display:flex;gap:.25rem;margin-left:auto}
.tab{padding:.5rem .95rem;border-radius:99px;color:var(--muted);font-weight:600;font-size:.92rem;transition:all var(--dur)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface2);color:var(--text)}
#whoami{color:var(--dim);font-size:.8rem;cursor:pointer;margin-left:.4rem}
#whoami:hover{color:var(--red)}

/* ---------- Tagesleiste ---------- */
.dayline{max-width:1100px;margin:0 auto;padding:.6rem 1rem 0;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.dayline .lbl{font-size:.85rem;color:var(--muted);font-weight:600}
.pbar{flex:1;min-width:140px;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-d),var(--green));border-radius:99px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.streak{font-size:.85rem;color:var(--amber);font-weight:700}

/* ---------- Fokus ---------- */
main{max-width:1100px;margin:0 auto;padding:1rem;padding-bottom:5rem}
.focuswrap{max-width:640px;margin:0 auto}
.why{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;font-weight:700;padding:.35rem .85rem;border-radius:99px;margin-bottom:.8rem}
.why.wv{background:rgba(251,191,36,.14);color:var(--amber)}
.why.warm{background:rgba(251,146,60,.14);color:var(--orange)}
.why.legal{background:rgba(167,139,250,.14);color:var(--purple)}
.why.neu{background:rgba(59,130,246,.14);color:var(--blue)}
.fcard{background:linear-gradient(180deg,var(--surface),#0b101b);border:1px solid var(--line);border-radius:24px;padding:1.6rem;box-shadow:0 24px 60px -30px rgba(0,0,0,.8)}
.fcard h2{font-size:clamp(1.3rem,4.5vw,1.7rem);line-height:1.25;letter-spacing:-.02em}
.fmeta{color:var(--muted);font-size:.92rem;margin:.35rem 0 .9rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.1rem}
.chip{font-size:.78rem;font-weight:600;padding:.28rem .7rem;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.p143{background:rgba(167,139,250,.15);color:var(--purple)}
.hook{background:rgba(34,197,94,.07);border-left:3px solid var(--green);border-radius:10px;padding:.7rem .9rem;font-size:.9rem;color:var(--text);margin-bottom:1.2rem}
.hook b{color:var(--green)}
.cta{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:1.05rem;border-radius:16px;font-weight:800;font-size:1.12rem;transition:transform var(--dur),filter var(--dur),box-shadow var(--dur)}
.cta:active{transform:scale(.98)}
.cta.call{background:var(--green);color:#04160a;box-shadow:0 12px 30px -12px rgba(34,197,94,.55)}
.cta.call:hover{filter:brightness(1.08)}
.cta.mail{background:var(--blue);color:#fff;box-shadow:0 12px 30px -12px rgba(59,130,246,.55)}
.cta.mail:hover{filter:brightness(1.08)}
.cta.ghost{background:var(--surface2);color:var(--text);font-size:1rem;font-weight:600;padding:.8rem}
.ctastack{display:flex;flex-direction:column;gap:.6rem}
.outcome{margin-top:1.2rem}
.outcome .lbl{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.obtn{display:flex;align-items:center;gap:.55rem;padding:.85rem .9rem;border-radius:13px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:.92rem;transition:all var(--dur)}
.obtn:hover{border-color:var(--muted)}
.obtn.win{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:var(--green)}
.obtn.win:hover{background:rgba(34,197,94,.2)}
.frow{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem}
.linkbtn{color:var(--dim);font-size:.88rem;font-weight:600;padding:.4rem .2rem;transition:color var(--dur)}
.linkbtn:hover{color:var(--text)}
.qinfo{text-align:center;color:var(--dim);font-size:.82rem;margin-top:1rem}
details.guide{margin-top:1.1rem;background:var(--surface2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.guide summary{padding:.8rem 1rem;font-weight:700;font-size:.92rem;cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem;color:var(--purple)}
details.guide[open] summary{border-bottom:1px solid var(--line)}
details.guide .g-body{padding:1rem;font-size:.88rem;color:var(--muted)}
details.guide .q{color:var(--text);font-style:italic}
.empty{max-width:520px;margin:3rem auto;text-align:center}
.empty h2{margin-bottom:.5rem}
.empty p{color:var(--muted)}

/* ---------- Pipeline ---------- */
.pipe{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.9rem}
.pcol .ph{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem}
.pcol .n{font-family:Sora;font-size:1.3rem}
.mini{padding:.55rem .6rem;border-radius:10px;background:var(--surface2);margin-bottom:.4rem;cursor:pointer;font-size:.82rem;font-weight:600;line-height:1.3;transition:background var(--dur)}
.mini:hover{background:var(--line)}
.mini .o{display:block;color:var(--dim);font-weight:400;font-size:.74rem}

/* ---------- Liste ---------- */
.search{max-width:640px;margin:0 auto 1rem;display:flex;gap:.5rem}
.lrow{max-width:640px;margin:0 auto .5rem;display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.75rem .9rem;cursor:pointer;transition:border-color var(--dur)}
.lrow:hover{border-color:var(--muted)}
.score{width:40px;height:40px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;font-family:Sora}
.s-hi{background:rgba(34,197,94,.14);color:var(--green)}
.s-mid{background:rgba(251,191,36,.12);color:var(--amber)}
.s-lo{background:var(--surface2);color:var(--dim)}
.lrow .nm{font-weight:700;font-size:.94rem;line-height:1.3}
.lrow .st{margin-left:auto;flex:none;font-size:.72rem;font-weight:700;padding:.25rem .6rem;border-radius:99px}
.lrow .sub{color:var(--muted);font-size:.8rem}
.morebtn{display:block;margin:1rem auto;padding:.7rem 1.6rem;border-radius:99px;background:var(--surface2);font-weight:600}

/* ---------- Modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20}
#modal{position:fixed;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;display:none;z-index:21}
@media(min-width:720px){#modal{inset:4vh auto auto 50%;transform:translateX(-50%);width:min(680px,94vw);border-radius:22px;max-height:90vh}}
#modal .inner{padding:1.4rem;position:relative}
#modal h2{font-size:1.25rem;padding-right:2rem}
#modal .meta{color:var(--muted);font-size:.86rem;margin:.4rem 0 1rem}
.close{position:absolute;top:1rem;right:1rem;color:var(--dim);padding:.4rem}
.statusrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.statusbtn{padding:.45rem .8rem;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted);transition:all var(--dur)}
.statusbtn.on{color:var(--text);border-color:currentColor}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.abtn{display:inline-flex;align-items:center;gap:.45rem;padding:.65rem 1rem;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:.9rem;transition:all var(--dur)}
.abtn:hover{border-color:var(--muted)}
.abtn.g{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--green)}
.abtn.b{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35);color:#93bbfd}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0 .6rem}
.fieldgrid label{display:block;font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.sec-title{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:1.1rem 0 .5rem}
.note{background:var(--surface2);border-radius:10px;padding:.55rem .75rem;font-size:.85rem;margin-bottom:.4rem}
.note .d{color:var(--dim);font-size:.72rem;margin-bottom:.15rem}
.addnote{display:flex;gap:.5rem;margin-top:.6rem}
.addnote button{background:var(--blue);color:#fff;border-radius:10px;padding:0 1rem;font-weight:700}
pre.mailpre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1rem;font:.84rem/1.5 Inter;color:var(--muted);margin:.6rem 0}

#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:.7rem 1.2rem;border-radius:99px;font-size:.9rem;font-weight:600;display:none;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none;overflow:hidden}
.cf{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#winbanner{position:fixed;top:38vh;left:50%;transform:translateX(-50%) scale(.8);background:var(--surface);border:1px solid var(--green);color:var(--text);padding:1rem 2rem;border-radius:18px;font-family:Sora;font-weight:700;font-size:1.15rem;opacity:0;pointer-events:none;z-index:61;transition:all .3s;text-align:center}
#winbanner.show{opacity:1;transform:translateX(-50%) scale(1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.ogrid{grid-template-columns:1fr 1fr}.fieldgrid{grid-template-columns:1fr}.tabs{gap:0}.tab{padding:.5rem .7rem;font-size:.86rem}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Werkstatt <em style="color:var(--green);font-style:normal">Digital</em></h1>
    <p>Team-Zugang. Passwort = euer GitHub-Schlüssel.</p>
    <input id="tokenInput" type="password" placeholder="Passwort (PAT)" autocomplete="current-password">
    <input id="nameInput" placeholder="Dein Name (z.B. Murat)" autocomplete="name">
    <button class="cta call" onclick="doLogin()">Anmelden</button>
    <div id="loginErr"></div>
  </div>
</div>

<header id="hdr" style="display:none">
  <div class="hrow">
    <span class="brand">WD<em>·</em>CRM</span>
    <nav class="tabs">
      <button class="tab on" id="tab-fokus" onclick="setView('fokus')">Fokus</button>
      <button class="tab" id="tab-pipeline" onclick="setView('pipeline')">Pipeline</button>
      <button class="tab" id="tab-alle" onclick="setView('alle')">Alle</button>
    </nav>
    <span id="whoami" onclick="logout()"></span>
  </div>
  <div class="dayline" id="dayline"></div>
</header>

<main id="main" style="display:none"></main>

<div id="overlay" onclick="closeModal()"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="confetti"></div>
<div id="winbanner"></div>

<script>
/* ============ Backend (unverändert: gleiche Daten, gleicher Login) ============ */
const STATI=[
 {k:"offen",l:"Offen",c:"#8b94ab"},{k:"mail",l:"Mail raus",c:"#3b82f6"},
 {k:"call",l:"Angerufen",c:"#a78bfa"},{k:"gespraech",l:"Gespräch",c:"#fbbf24"},
 {k:"angebot",l:"Angebot",c:"#fb923c"},{k:"pilot",l:"PILOT",c:"#22c55e"},{k:"tot",l:"Tot",c:"#f87171"}];
const SC=Object.fromEntries(STATI.map(s=>[s.k,s]));
let LEADS=[],VIEW="fokus",LIST_N=50;
const token=()=>localStorage.getItem("crm_token")||"";
const wer=()=>localStorage.getItem("crm_name")||"";
const OWNER="muratbhh222-hub",REPO="werkstatt-crm-data",FILE="leads.json";
const GH=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
let SHA=null;
const ghHeaders=()=>({authorization:"Bearer "+token(),accept:"application/vnd.github+json"});
function b64decode(b){const x=atob(b.replace(/\n/g,""));const y=new Uint8Array(x.length);for(let i=0;i<x.length;i++)y[i]=x.charCodeAt(i);return new TextDecoder().decode(y)}
function b64encode(s){const y=new TextEncoder().encode(s);let b="";for(let i=0;i<y.length;i+=8192)b+=String.fromCharCode(...y.subarray(i,i+8192));return btoa(b)}
async function loadLeads(){
  const r=await fetch(GH+"?t="+Date.now(),{headers:ghHeaders()});
  if(r.status===401){logout();throw new Error("auth")}
  if(!r.ok)throw new Error("api "+r.status);
  const j=await r.json();SHA=j.sha;return JSON.parse(b64decode(j.content))}
const heuteStr=()=>new Date().toISOString().slice(0,10);
const plusTage=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const AUTO_WV={mail:2,call:1,gespraech:3,angebot:3};
function applyUpd(lead,upd){
  const KEYS=STATI.map(s=>s.k);
  if(upd.status&&KEYS.includes(upd.status)&&upd.status!==lead.status){
    lead.status=upd.status;
    lead.notizen=(lead.notizen?lead.notizen+" | ":"")+`${stamp()}: → ${upd.status}`+(upd.wer?` (${upd.wer})`:"");
    if(!upd.wiedervorlage&&AUTO_WV[upd.status]){upd.wiedervorlage=plusTage(AUTO_WV[upd.status]);upd._autoWV=upd.wiedervorlage}
    if(upd.status==="pilot"||upd.status==="tot")upd.wiedervorlage="";
  }
  if(upd.note)lead.notizen=(lead.notizen?lead.notizen+" | ":"")+`${stamp()}: ${upd.note}`+(upd.wer?` (${upd.wer})`:"");
  for(const k of["telefon","email","website","ansprechpartner","zustaendig","wiedervorlage"])if(typeof upd[k]==="string")lead[k]=upd[k];
  lead.updated=new Date().toISOString();
}
async function updateLead(upd){
  for(let a=0;a<3;a++){
    const leads=await loadLeads();
    const lead=leads.find(l=>String(l.id)===String(upd.id));
    if(!lead)throw new Error("lead not found");
    applyUpd(lead,upd);
    const r=await fetch(GH,{method:"PUT",headers:ghHeaders(),body:JSON.stringify({
      message:`CRM: #${upd.id} ${lead.name}`.slice(0,70)+(upd.wer?` (${upd.wer})`:""),
      content:b64encode(JSON.stringify(leads)),sha:SHA})});
    if(r.ok){LEADS=leads;return lead}
    if(r.status!==409&&r.status!==422)throw new Error("api "+r.status);
  }
  throw new Error("conflict")}
async function doLogin(){
  const t=document.getElementById("tokenInput").value.trim(),n=document.getElementById("nameInput").value.trim();
  if(!t||!n){document.getElementById("loginErr").textContent="Passwort und Name eingeben";return}
  localStorage.setItem("crm_token",t);localStorage.setItem("crm_name",n);
  document.getElementById("loginErr").textContent="Lade …";
  try{await boot()}catch(e){localStorage.removeItem("crm_token");document.getElementById("loginErr").textContent="Falsches Passwort oder keine Verbindung"}}
function logout(){localStorage.removeItem("crm_token");location.reload()}
async function boot(){
  LEADS=await loadLeads();
  document.getElementById("login").style.display="none";
  document.getElementById("hdr").style.display="";
  document.getElementById("main").style.display="";
  document.getElementById("whoami").textContent=wer()+" · abmelden";
  render()}

/* ============ Helpers ============ */
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scoreCls=s=>s>=65?"s-hi":s>=45?"s-mid":"s-lo";
const is143=l=>/blind|sehbehindert/i.test(l.name+" "+(l.gruende||""));
const telHref=t=>"tel:"+String(t||"").replace(/[^+\d]/g,"");
function lastDate(l){const m=String(l.notizen||"").match(/\d{4}-\d{2}-\d{2}/g);return m?m[m.length-1]:null}
const wvDue=l=>l.wiedervorlage&&l.wiedervorlage<=heuteStr()&&!["pilot","tot"].includes(l.status);
const daysSince=d=>Math.floor((Date.now()-new Date(d).getTime())/864e5);
function warmDue(l){if(l.status!=="mail")return false;const d=lastDate(l);return d&&daysSince(d)>=2}
function allActivities(){
  const out=[];
  for(const l of LEADS)for(const p of String(l.notizen||"").split(" | ")){
    const m=p.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{2}:\d{2}))?:\s*(.*)$/s);if(!m)continue;
    const wm=m[3].match(/\(([^)]+)\)\s*$/);
    out.push({date:m[1],time:m[2]||"",text:m[3].replace(/\s*\([^)]+\)\s*$/,""),wer:wm?wm[1]:"?",lead:l})}
  return out.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}
function teamNamen(){const s=new Set([wer()]);for(const a of allActivities())if(a.wer&&a.wer!=="?")s.add(a.wer);for(const l of LEADS)if(l.zustaendig)s.add(l.zustaendig);return[...s]}
function streak(acts){const t=new Set(acts.map(a=>a.date));let s=0,d=new Date();if(!t.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(t.has(d.toISOString().slice(0,10))){s++;d.setDate(d.getDate()-1)}return s}
function celebrate(text){
  const box=document.getElementById("confetti");box.style.display="block";box.innerHTML="";
  const f=["#3b82f6","#a78bfa","#22c55e","#fbbf24","#f472b6","#fb923c"];
  for(let i=0;i<110;i++){const p=document.createElement("div");p.className="cf";p.style.left=Math.random()*100+"vw";p.style.background=f[i%f.length];p.style.animationDuration=(1.6+Math.random()*1.4)+"s";p.style.animationDelay=(Math.random()*.4)+"s";if(Math.random()>.5)p.style.borderRadius="50%";box.appendChild(p)}
  const bn=document.getElementById("winbanner");bn.textContent=text;bn.className="show";
  setTimeout(()=>{box.style.display="none";box.innerHTML="";bn.className=""},3200)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200)}
const TAGESZIEL=10;

/* SVG-Icons */
const I={

/* ============ Fokus-Queue (Verkaufslogik: wichtigste Aktion zuerst) ============ */
function buildQueue(){
  const me=wer(),seen=new Set(),q=[];
  const add=(l,why,cls)=>{if(!seen.has(l.id)){seen.add(l.id);q.push({l,why,cls})}};
  LEADS.filter(l=>wvDue(l)&&l.zustaendig===me).forEach(l=>add(l,"Wiedervorlage fällig — dein Lead","wv"));
  LEADS.filter(wvDue).forEach(l=>add(l,"Wiedervorlage fällig","wv"));
  LEADS.filter(warmDue).forEach(l=>add(l,`Warm-Call — Mail vor ${daysSince(lastDate(l))} Tagen`,"warm"));
  LEADS.filter(l=>l.status==="call").forEach(l=>add(l,"Dranbleiben — schon mal angerufen","warm"));
  LEADS.filter(l=>l.status==="offen"&&l.telefon&&is143(l)).sort((a,b)=>b.score-a.score).forEach(l=>add(l,"§143 — legal kalt anrufen","legal"));
  LEADS.filter(l=>l.status==="offen"&&l.email&&!is143(l)).sort((a,b)=>b.score-a.score).forEach(l=>add(l,"Neu — Erstkontakt per Mail","neu"));
  return q}
let Q=[],QI=0;

function hookLine(l){
  const prods=(l.produkte||"").split(",").map(s=>s.trim()).filter(Boolean);
  const anlass=prods.map(p=>ANLASS[p]).find(Boolean);
  if(anlass)return `<b>${esc(prods[0])}</b> passen perfekt für: ${esc(anlass)}.`;
  if(prods.length)return `Stellt her: <b>${esc(prods.slice(0,3).join(", "))}</b>.`;
  return `Produkte unbekannt — vorm Kontakt kurz die Website checken.`}

function renderFokus(){
  Q=buildQueue();
  const main=document.getElementById("main");
  if(QI>=Q.length){
    main.innerHTML=`<div class="empty"><h2>Queue leer 🏁</h2><p>Alles abgearbeitet. Morgen füllt sie sich durch die Wiedervorlagen von selbst wieder.</p></div>`;return}
  const {l,why,cls}=Q[QI];
  const prods=(l.produkte||"").split(",").map(s=>s.trim()).filter(Boolean).slice(0,4);
  const canCall=!!l.telefon,canMail=!!l.email;
  main.innerHTML=`<div class="focuswrap">
    <span class="why ${cls}">${esc(why)}</span>
    <div class="fcard">
      <h2>${esc(l.name)}</h2>
      <div class="fmeta">${esc(l.ort||"")}${l.bundesland?" · "+esc(l.bundesland):""}${l.ansprechpartner?" · 👤 "+esc(l.ansprechpartner):""} · Score ${l.score}</div>
      <div class="chips">${is143(l)?'<span class="chip p143">§143 · Kaltakquise legal</span>':""}${prods.map(p=>`<span class="chip">${esc(p)}</span>`).join("")}</div>
      <div class="hook">${hookLine(l)}</div>
      <div class="ctastack">
        ${canCall?`<a class="cta call" href="${telHref(l.telefon)}">${I.phone} Anrufen · ${esc(l.telefon)}</a>`:""}
        ${canMail?`<button class="cta ${canCall?"ghost":"mail"}" onclick="sendMail(${l.id})">${I.mail} Mail-Entwurf öffnen</button>`:""}
        ${!canCall&&!canMail?`<button class="cta ghost" onclick="openModal(${l.id})">Kontaktdaten nachtragen</button>`:""}
      </div>
      <div class="outcome">
        <div class="lbl">Und? Ergebnis antippen:</div>
        <div class="ogrid">
          <button class="obtn" onclick="logOutcome(${l.id},'Nicht erreicht')">${I.x} Nicht erreicht</button>
          <button class="obtn" onclick="logOutcome(${l.id},'AB, Nachricht hinterlassen')">${I.vm} AB besprochen</button>
          <button class="obtn" onclick="logOutcome(${l.id},'Gespräch geführt','gespraech')">${I.chat} Gespräch</button>
          <button class="obtn win" onclick="logOutcome(${l.id},'Termin vereinbart!','gespraech')">${I.cal} Termin!</button>
        </div>
      </div>
      <div class="frow">
        <button class="linkbtn" onclick="openModal(${l.id})">Details & Notizen</button>
        <button class="linkbtn" onclick="skipLead()">Überspringen ›</button>
      </div>
      <details class="guide"><summary>🎯 Gesprächsleitfaden für diese Werkstatt</summary><div class="g-body">${buildLeitfaden(l)}</div></details>
    </div>
    <div class="qinfo">${QI+1} von ${Q.length} in der Queue</div>
  </div>`;
  renderDayline()}
function skipLead(){QI++;renderFokus()}
async function logOutcome(id,text,status){
  const LOG_WV={"Nicht erreicht":1,"AB, Nachricht hinterlassen":2,"Gespräch geführt":3,"Termin vereinbart!":1};
  try{
    const b={id,note:"📞 "+text,wer:wer()};
    if(status)b.status=status;
    if(LOG_WV[text])b.wiedervorlage=plusTage(LOG_WV[text]);
    await updateLead(b);
    if(text==="Termin vereinbart!")celebrate("📅 TERMIN! Stark, "+wer()+"!");
    else toast(text+" · Wiedervorlage "+b.wiedervorlage);
    QI++;render();
  }catch(e){toast("Fehler beim Speichern")}}

/* ============ Mail-Versand (Erstkontakt) ============ */
async function sendMail(id){
  const l=LEADS.find(x=>x.id===id);if(!l||!l.email)return;
  const txt=mailTemplate(l);
  const subj=txt.split("\n")[0].replace(/^Betreff:\s*/,"");
  const body=txt.split("\n").slice(1).join("\n").trim();
  location.href=`mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  if(l.status==="offen"){
    try{await updateLead({id,status:"mail",note:"✉️ Erstkontakt-Mail geöffnet/gesendet",wer:wer()});
      toast("Mail-Programm offen · Status: Mail raus · Warm-Call in 2 Tagen");QI++;setTimeout(render,600);
    }catch(e){toast("Mail offen, Status-Speichern fehlgeschlagen")}}
}

/* ============ Tagesleiste ============ */
function renderDayline(){
  const acts=allActivities(),heute=heuteStr();
  const mine=acts.filter(a=>a.wer===wer()&&a.date===heute&&(/^📞/.test(a.text)||/^✉/.test(a.text)));
  const st=streak(acts.filter(a=>a.wer===wer()));
  const pct=Math.min(100,Math.round(mine.length/TAGESZIEL*100));
  document.getElementById("dayline").innerHTML=
    `<span class="lbl">Heute: <b style="color:var(--text)">${mine.length}</b>/${TAGESZIEL} Kontakte</span>
     <div class="pbar"><i style="width:${pct}%"></i></div>
     ${st>1?`<span class="streak">🔥 ${st} Tage Serie</span>`:""}`}

/* ============ Pipeline ============ */
function renderPipeline(){
  const main=document.getElementById("main");
  main.innerHTML=`<div class="pipe">`+STATI.filter(s=>s.k!=="tot").map(s=>{
    const ls=LEADS.filter(l=>l.status===s.k);
    const show=s.k==="offen"?[]:ls.slice(0,8);
    return `<div class="pcol"><div class="ph" style="color:${s.c}">${s.l}<span class="n" style="color:var(--text)">${ls.length}</span></div>
      ${show.map(l=>`<div class="mini" onclick="openModal(${l.id})">${esc(l.name.slice(0,42))}<span class="o">${esc(l.ort||"")}${l.wiedervorlage?" · WV "+l.wiedervorlage:""}</span></div>`).join("")}
      ${s.k==="offen"?`<div style="color:var(--dim);font-size:.8rem">Neue Leads landen automatisch im Fokus.</div>`:""}</div>`}).join("")+`</div>`;
  renderDayline()}

/* ============ Alle / Suche ============ */
function renderAlle(){
  const main=document.getElementById("main");
  const q=(window._q||"").toLowerCase();
  let list=LEADS;
  if(q)list=list.filter(l=>(l.name+" "+l.ort+" "+(l.produkte||"")+" "+l.bundesland+" "+(l.notizen||"")).toLowerCase().includes(q));
  list=[...list].sort((a,b)=>b.score-a.score);
  main.innerHTML=`<div class="search"><input id="search" placeholder="Suchen: Name, Ort, Produkt …" value="${esc(window._q||"")}" oninput="window._q=this.value;renderAlle()"></div>`
   +list.slice(0,LIST_N).map(l=>{const s=SC[l.status]||SC.offen;
     return `<div class="lrow" onclick="openModal(${l.id})">
       <div class="score ${scoreCls(l.score)}">${l.score}</div>
       <div style="min-width:0"><div class="nm">${esc(l.name)}</div><div class="sub">${esc(l.ort||"")}${l.telefon?" · "+esc(l.telefon):""}</div></div>
       <span class="st" style="background:${s.c}22;color:${s.c}">${s.l}</span></div>`}).join("")
   +(list.length>LIST_N?`<button class="morebtn" onclick="LIST_N+=50;renderAlle()">Mehr anzeigen (${list.length-LIST_N} weitere)</button>`:"");
  const inp=document.getElementById("search");if(q){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
  renderDayline()}

function setView(v){VIEW=v;for(const t of["fokus","pipeline","alle"])document.getElementById("tab-"+t).classList.toggle("on",t===v);render()}
function render(){({fokus:renderFokus,pipeline:renderPipeline,alle:renderAlle})[VIEW]()}

/* ============ Modal ============ */
function notesHTML(l){
  const parts=String(l.notizen||"").split(" | ").filter(Boolean).reverse();
  if(!parts.length)return `<div class="note" style="color:var(--dim)">Noch keine Notizen.</div>`;
  return parts.map(p=>{const m=p.match(/^(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?):\s*(.*)$/s);
    return m?`<div class="note"><div class="d">${m[1]}</div>${esc(m[2])}</div>`:`<div class="note">${esc(p)}</div>`}).join("")}

function closeModal(){document.getElementById("overlay").style.display="none";document.getElementById("modal").style.display="none"}
async function setStatus(id,status){
  try{const upd={id,status,wer:wer()};await updateLead(upd);
    if(status==="pilot")celebrate("🎉 PILOT GEWONNEN! Der erste zahlende Kunde!");
    else if(status==="angebot")celebrate("💰 ANGEBOT RAUS! "+wer()+" liefert.");
    else toast("Status: "+SC[status].l+(upd._autoWV?" · WV "+upd._autoWV:""));
    openModal(id);render()}catch(e){toast("Fehler beim Speichern")}}
async function addNote(id){
  const inp=document.getElementById("newnote"),note=inp.value.trim();if(!note)return;
  try{await updateLead({id,note,wer:wer()});openModal(id);render()}catch(e){toast("Fehler beim Speichern")}}
async function saveKontakt(id){
  const b={id,wer:wer()};
  for(const k of["telefon","email","ansprechpartner","website","zustaendig","wiedervorlage"])b[k]=document.getElementById("f-"+k).value.trim();
  try{await updateLead(b);toast("Gespeichert");closeModal();render()}catch(e){toast("Fehler beim Speichern")}}

/* ============ Mail-Vorlage & Leitfaden ============ */
function mailTemplate(l){
  const prods=(l.produkte||"Handwerksprodukte").split(",").map(s=>s.trim()).filter(Boolean);
  const pk=prods[0]||"Produkte";
  const ps=prods.length>1?prods.slice(0,3).join(", "):pk;
  const ort=l.ort&&l.ort!=="?"?"in "+l.ort:"in Ihrer Werkstatt";
  const blind=is143(l)?"\n\nEin Punkt, der speziell für Ihre Werkstatt gilt: Die aktive Ansprache von Unternehmen ist für Blindenwaren rechtlich ausdrücklich zulässig (§ 143 SGB IX). Diesen Kanal nutzt für Sie aktuell niemand.":"";
  const anrede=l.ansprechpartner?`Guten Tag ${l.ansprechpartner},`:"Guten Tag,";
  return `Betreff: Firmenkunden für Ihre ${pk} – kurze Idee für ${l.name}

${anrede}

ich habe gesehen, dass Sie ${ort} ${ps} in richtig guter Qualität herstellen. Was mir aufgefallen ist: an Firmenkunden verkaufen Sie das aktuell kaum aktiv, obwohl genau dort gerade viel Nachfrage nach nachhaltigen Geschenken aus Werkstätten besteht.

Wir bei Werkstatt Digital bauen und betreiben genau diesen Firmenvertrieb für Werkstätten: eine verkaufsstarke Produktseite, aktive Ansprache von Unternehmen und sauberes Nachfassen. Sie produzieren, wir bringen die Anfragen. Kein Risiko und kein Aufwand für Ihr Team.${blind}

Hätten Sie diese Woche 15 Minuten, damit ich kurz zeige, wie das für ${l.name} aussehen könnte?

Beste Grüße
Murat Bahce – Werkstatt Digital
muratbhh222@gmail.com`}
